<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal RAG Assistant</title>
    <meta name="description" content="AI-powered legal document assistant with RAG technology">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="newChatBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    New Chat
                </button>
            </div>

            <div class="sidebar-search">
                <div class="search-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search conversations...">
                </div>
            </div>

            <div class="conversation-list" id="conversationList">
                <!-- Populated by JavaScript -->
            </div>

            <div class="sidebar-footer">
                <button class="sidebar-footer-btn" id="themeToggle" title="Toggle theme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                        <circle cx="12" cy="12" r="5" />
                        <path
                            d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                    </svg>
                    Theme
                </button>
                <button class="sidebar-footer-btn" id="uploadToggle" title="Upload documents">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="17 8 12 3 7 8" />
                        <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                    Upload
                </button>
            </div>
        </aside>

        <!-- Sidebar overlay for mobile -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="chat-header">
                <button class="menu-toggle" id="menuToggle" title="Toggle sidebar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>

                <div class="header-logo">⚖️</div>

                <div class="header-title">
                    <h1>Legal RAG Assistant</h1>
                    <p>Powered by FastAPI & AI</p>
                </div>

                <div class="header-actions">
                    <div class="status-badge">
                        <div class="status-dot checking" id="statusDot"></div>
                        <span class="status-text" id="statusText">Checking...</span>
                    </div>

                    <button class="icon-btn" id="uploadToggleHeader" title="Upload PDF"
                        onclick="document.getElementById('uploadToggle').click()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                            <line x1="12" y1="18" x2="12" y2="12" />
                            <line x1="9" y1="15" x2="15" y2="15" />
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Messages -->
            <div class="messages-container" id="messagesContainer">
                <div class="messages-wrapper" id="messagesWrapper">
                    <!-- Welcome screen or messages populated by JavaScript -->
                </div>
            </div>

            <!-- Input -->
            <div class="input-container">
                <div class="input-wrapper">
                    <!-- Language Pills -->
                    <div class="language-pills" id="languagePills">
                        <span class="language-label">Response in:</span>
                        <button class="lang-pill active" data-lang="en">
                            <span class="pill-text">English</span>
                        </button>
                        <button class="lang-pill" data-lang="kn">
                            <span class="pill-text">ಕನ್ನಡ</span>
                        </button>
                        <button class="lang-pill" data-lang="hi">
                            <span class="pill-text">हिंदी</span>
                        </button>
                    </div>

                    <form class="input-box" id="chatForm">
                        <textarea class="message-input" id="messageInput" placeholder="Ask about legal documents..."
                            rows="1" autocomplete="off"></textarea>
                        <div class="input-actions">
                            <button type="button" class="attach-btn" title="Attach file"
                                onclick="document.getElementById('uploadToggle').click()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path
                                        d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                                </svg>
                            </button>
                            <button type="submit" class="send-btn" id="sendBtn" title="Send message">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                                </svg>
                            </button>
                        </div>
                    </form>
                    <div class="input-hint">
                        Press <kbd>Enter</kbd> to send • <kbd>Ctrl+N</kbd> for new chat
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Upload Document</h3>
                <button class="modal-close" id="modalClose">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>

            <div class="upload-zone" id="uploadZone">
                <input type="file" id="fileInput" accept=".pdf" hidden>
                <svg class="upload-zone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                </svg>
                <h4>Drop your PDF here</h4>
                <p>or click to browse</p>
            </div>

            <div class="tag-input-wrapper">
                <label for="tagInput">Tag (optional)</label>
                <input type="text" class="tag-input" id="tagInput" placeholder="e.g., CPC, RERA, Contract">
            </div>

            <div class="upload-status" id="uploadStatus"></div>

            <div class="modal-actions">
                <button class="modal-btn secondary" id="cancelUpload">Cancel</button>
                <button class="modal-btn primary" id="uploadBtn" disabled>Upload</button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script src="/static/app.js"></script>
</body>

</html>
